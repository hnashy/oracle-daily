name: ORACLE Weekly Predict + Learn

on:
  schedule:
    # Saturday 09:00 UTC — weekly predictions before weekend fixtures
    - cron: "0 9 * * 6"
    # Monday 10:00 UTC — post-weekend learn reminder / optional learn job
    - cron: "0 10 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "predict | learn | both"
        required: true
        default: predict
        type: choice
        options:
          - predict
          - learn
          - both
      league:
        description: "League key (en.1 = EPL for now)"
        required: true
        default: en.1
      week_label:
        description: "Label for Telegram report (e.g. MW10)"
        required: false
        default: "Matchweek"
      send_telegram:
        description: "Send report to Telegram"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  weekly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve mode (schedule vs manual)
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DOW=$(date -u +%u)  # 1=Mon ... 6=Sat
            if [ "$DOW" = "6" ]; then
              echo "mode=predict" >> $GITHUB_OUTPUT
            else
              echo "mode=learn" >> $GITHUB_OUTPUT
            fi
          else
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          fi
          echo "league=${{ inputs.league || 'en.1' }}" >> $GITHUB_OUTPUT
          echo "week=${{ inputs.week_label || 'Matchweek' }}" >> $GITHUB_OUTPUT
          echo "telegram=${{ inputs.send_telegram || 'true' }}" >> $GITHUB_OUTPUT

      - name: Ensure model + paths
        run: |
          mkdir -p data/models data/raw/weekly reports
          if [ ! -f data/models/oracle_en1_2024-25.json ]; then
            echo "ERROR: production model missing at data/models/oracle_en1_2024-25.json"
            exit 1
          fi
          python -c "import json; d=json.load(open('data/models/oracle_en1_2024-25.json')); print('Model matches_trained:', d.get('matches_trained'))"

      - name: Predict (if mode predict or both)
        if: steps.mode.outputs.mode == 'predict' || steps.mode.outputs.mode == 'both'
        run: |
          set -e
          FIXTURES="data/raw/weekly/fixtures_${{ steps.mode.outputs.league }}.json"
          if [ ! -f "$FIXTURES" ]; then
            echo "No fixtures file at $FIXTURES"
            echo "Create it manually or via a collect-fixtures step. Sending status to Telegram."
            python - <<'PY'
          import os, json, urllib.request
          token=os.environ.get("TELEGRAM_BOT_TOKEN")
          chat=os.environ.get("TELEGRAM_CHAT_ID")
          text=("<b>ORACLE Weekly</b>\n"
                "No fixtures file found.\n"
                "Add <code>data/raw/weekly/fixtures_en.1.json</code> then re-run.")
          if token and chat:
              body=json.dumps({"chat_id":chat,"text":text,"parse_mode":"HTML"}).encode()
              req=urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=body, headers={"Content-Type":"application/json"})
              urllib.request.urlopen(req, timeout=30)
              print("Notified Telegram: missing fixtures")
          else:
              print("Telegram secrets missing")
          PY
            exit 0
          fi

          TG_FLAG=""
          if [ "${{ steps.mode.outputs.telegram }}" = "true" ]; then
            TG_FLAG="--telegram"
          fi

          python tools/weekly_pipeline.py predict "$FIXTURES" \
            --model data/models/oracle_en1_2024-25.json \
            --out "reports/weekly_${{ steps.mode.outputs.league }}.json" \
            --league "${{ steps.mode.outputs.league }}" \
            --week "${{ steps.mode.outputs.week }}" \
            $TG_FLAG

      - name: Learn (if mode learn or both)
        if: steps.mode.outputs.mode == 'learn' || steps.mode.outputs.mode == 'both'
        run: |
          set -e
          RESULTS="data/raw/weekly/results_${{ steps.mode.outputs.league }}.json"
          if [ ! -f "$RESULTS" ]; then
            echo "No results file at $RESULTS — skip learn"
            exit 0
          fi
          python tools/weekly_pipeline.py learn "$RESULTS" \
            --model data/models/oracle_en1_2024-25.json

      - name: Commit updated model / reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/models/*.json reports/weekly_*.json || true
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore(oracle): weekly pipeline update"
            git push
          fi
