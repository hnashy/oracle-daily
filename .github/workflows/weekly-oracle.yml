name: ORACLE Weekly Multi-League

on:
  schedule:
    - cron: "0 9 * * 6"   # Saturday predict
    - cron: "0 10 * * 1"  # Monday learn
  workflow_dispatch:
    inputs:
      mode:
        description: "predict | learn | both"
        required: true
        default: both
        type: choice
        options: [predict, learn, both]
      send_telegram:
        description: "Send Telegram"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      season:
        description: "OpenFootball season (auto or 2026-27)"
        required: false
        default: auto

jobs:
  weekly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        league: [en.1, es.1, it.1, de.1, fr.1]
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DOW=$(date -u +%u)
            if [ "$DOW" = "6" ]; then echo "mode=predict" >> $GITHUB_OUTPUT
            else echo "mode=learn" >> $GITHUB_OUTPUT; fi
          else
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          fi
          echo "telegram=${{ inputs.send_telegram || 'true' }}" >> $GITHUB_OUTPUT
          echo "season=${{ inputs.season || 'auto' }}" >> $GITHUB_OUTPUT

      - name: Map model path
        id: model
        run: |
          L="${{ matrix.league }}"
          case "$L" in
            en.1) echo "path=data/models/oracle_en1_2024-25.json" >> $GITHUB_OUTPUT ;;
            es.1) echo "path=data/models/oracle_es1_2024-25.json" >> $GITHUB_OUTPUT ;;
            it.1) echo "path=data/models/oracle_it1_2024-25.json" >> $GITHUB_OUTPUT ;;
            de.1) echo "path=data/models/oracle_de1_2024-25.json" >> $GITHUB_OUTPUT ;;
            fr.1) echo "path=data/models/oracle_fr1_2024-25.json" >> $GITHUB_OUTPUT ;;
          esac

      - name: Ensure model
        run: |
          mkdir -p data/models data/raw/weekly reports
          if [ ! -f "${{ steps.model.outputs.path }}" ]; then
            echo "Missing model ${{ steps.model.outputs.path }}"
            exit 1
          fi

      - name: Auto-fetch OpenFootball
        run: |
          python tools/fetch_openfootball_week.py \
            --league "${{ matrix.league }}" \
            --season "${{ steps.mode.outputs.season }}" \
            --upcoming-days 10 --results-days 10 \
            --out-dir data/raw/weekly

      - name: Predict + Telegram
        if: steps.mode.outputs.mode == 'predict' || steps.mode.outputs.mode == 'both'
        run: |
          set -e
          FIX="data/raw/weekly/fixtures_${{ matrix.league }}.json"
          N=$(python -c "import json; print(len(json.load(open('$FIX'))))")
          echo "${{ matrix.league }} upcoming: $N"
          if [ "$N" = "0" ]; then
            echo "No fixtures — skip"
            exit 0
          fi
          TG=""
          if [ "${{ steps.mode.outputs.telegram }}" = "true" ]; then TG="--telegram"; fi
          python tools/weekly_pipeline.py predict "$FIX" \
            --model "${{ steps.model.outputs.path }}" \
            --out "reports/weekly_${{ matrix.league }}.json" \
            --league "${{ matrix.league }}" \
            --week "Auto" \
            $TG

      - name: Learn
        if: steps.mode.outputs.mode == 'learn' || steps.mode.outputs.mode == 'both'
        run: |
          set -e
          RES="data/raw/weekly/results_${{ matrix.league }}.json"
          N=$(python -c "import json; print(len(json.load(open('$RES'))))")
          echo "${{ matrix.league }} results: $N"
          if [ "$N" = "0" ]; then exit 0; fi
          python tools/weekly_pipeline.py learn "$RES" \
            --model "${{ steps.model.outputs.path }}"

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/models/*.json data/raw/weekly/*.json reports/weekly_*.json || true
          if git diff --cached --quiet; then echo "Nothing to commit"
          else
            git commit -m "chore(oracle): weekly ${{ matrix.league }}"
            git pull --rebase || true
            git push || true
          fi
